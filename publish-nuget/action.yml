name: "Publish NuGet Package"
description: "Packs and publishes a .NET project as a NuGet package"

inputs:
  dotnet-version:
    description: "The .NET SDK version to install (e.g. '10.0.x', '9.0.x')"
    required: false
    default: "10.0.x"
  project-path:
    description: "Path to the project file to pack and publish"
    required: true
  configuration:
    description: "Build configuration (e.g. Debug, Release)"
    required: false
    default: "Release"
  package-version:
    description: "Version for the NuGet package. If empty, uses the version from the project file."
    required: false
    default: ""
  nuget-source:
    description: "NuGet feed URL to publish to"
    required: false
    default: "https://api.nuget.org/v3/index.json"
  nuget-api-key:
    description: "API key for the NuGet feed"
    required: true
  output-directory:
    description: "Directory to place the packed .nupkg files"
    required: false
    default: "nupkg"
  extra-pack-args:
    description: "Additional arguments to pass to dotnet pack"
    required: false
    default: ""
  skip-duplicate:
    description: "Skip publishing if the package version already exists (true/false)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Validate NuGet metadata
      shell: bash
      run: |
        PROJECT_FILE="${{ inputs.project-path }}"
        ERRORS=()

        check_property() {
          local prop="$1"
          if ! grep -qiE "<${prop}[^>]*>[^<[:space:]]" "$PROJECT_FILE"; then
            ERRORS+=("  - Missing required NuGet property: <${prop}>")
          fi
        }

        check_property "PackageId"
        check_property "Authors"
        check_property "Description"
        check_property "PackageProjectUrl"
        check_property "RepositoryUrl"
        check_property "PackageTags"
        check_property "PackageReadmeFile"
        check_property "Copyright"

        # Version: accept Version, PackageVersion, or VersionPrefix
        if ! grep -qiE "<(Version|PackageVersion|VersionPrefix)[^>]*>[^<[:space:]]" "$PROJECT_FILE"; then
          ERRORS+=("  - Missing required NuGet property: <Version>, <PackageVersion>, or <VersionPrefix>")
        fi

        # License: accept PackageLicenseExpression or PackageLicenseFile
        if ! grep -qiE "<(PackageLicenseExpression|PackageLicenseFile)[^>]*>[^<[:space:]]" "$PROJECT_FILE"; then
          ERRORS+=("  - Missing required NuGet property: <PackageLicenseExpression> or <PackageLicenseFile>")
        fi

        # Validate that the README file referenced by PackageReadmeFile actually exists
        README_FILE=$(sed -n 's/.*<PackageReadmeFile[^>]*>\(.*\)<\/PackageReadmeFile>.*/\1/Ip' "$PROJECT_FILE" | head -1 | tr -d '[:space:]')
        if [ -n "$README_FILE" ]; then
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          if [ ! -f "${PROJECT_DIR}/${README_FILE}" ] && [ ! -f "${README_FILE}" ]; then
            ERRORS+=("  - PackageReadmeFile references '${README_FILE}' but the file does not exist relative to the project directory")
          fi
        fi

        if [ ${#ERRORS[@]} -gt 0 ]; then
          echo "::error::NuGet metadata validation failed for '${PROJECT_FILE}'. Please add the missing properties to a <PropertyGroup> in your project file:"
          for error in "${ERRORS[@]}"; do
            echo "::error::${error}"
          done
          echo ""
          echo "Example <PropertyGroup> with all required NuGet metadata:"
          echo "  <PropertyGroup>"
          echo "    <PackageId>Your.Package.Id</PackageId>"
          echo "    <Version>1.0.0</Version>"
          echo "    <Authors>Your Name</Authors>"
          echo "    <Description>A short description of what the package does.</Description>"
          echo "    <Copyright>Copyright (c) $(date +%Y) Your Name</Copyright>"
          echo "    <PackageLicenseExpression>MIT</PackageLicenseExpression>"
          echo "    <PackageProjectUrl>https://github.com/your/repo</PackageProjectUrl>"
          echo "    <RepositoryUrl>https://github.com/your/repo</RepositoryUrl>"
          echo "    <PackageTags>tag1;tag2;tag3</PackageTags>"
          echo "    <PackageReadmeFile>README.md</PackageReadmeFile>"
          echo "  </PropertyGroup>"
          echo "  <!-- Also include the README in the package: -->"
          echo "  <ItemGroup>"
          echo "    <None Include=\"README.md\" Pack=\"true\" PackagePath=\"\\\" />"
          echo "  </ItemGroup>"
          exit 1
        fi

        echo "✅ NuGet metadata validation passed."

    - name: Pack
      shell: bash
      run: >-
        dotnet pack ${{ inputs.project-path }}
        --configuration ${{ inputs.configuration }}
        --output ${{ inputs.output-directory }}
        ${{ inputs.package-version != '' && format('/p:PackageVersion={0}', inputs.package-version) || '' }}
        ${{ inputs.extra-pack-args }}

    - name: Publish to NuGet
      shell: bash
      run: >-
        dotnet nuget push "${{ inputs.output-directory }}/*.nupkg"
        --source ${{ inputs.nuget-source }}
        --api-key ${{ inputs.nuget-api-key }}
        ${{ inputs.skip-duplicate == 'true' && '--skip-duplicate' || '' }}

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ${{ inputs.output-directory }}/*.nupkg
        retention-days: 30
